<title>ボン度計算</title>

<script language="javascript" type="text/javascript">
    function OnCalculate() {
        let string = document.inputForm.input.value;
        string = string.replace(/\s+/g, "");
        let table = document.getElementById("resultTable");
        let wordRowCells = table.rows[1].cells;
        let resultRowCells = table.rows[2].cells;
        
        let bondFactor = 0
        
        for( var i = 0; i < wordRowCells.length; i++  ){
            let word = wordRowCells[i].innerHTML;
            let count = ( string.match( new RegExp( word, "g" ) ) || [] ).length;
            resultRowCells[i+1].innerHTML = count;
            if (i<10) {
                bondFactor += count;
            } else {
                bondFactor -= count;
            }
        }
        resultRowCells[0].innerHTML = bondFactor;

    }
</script>
