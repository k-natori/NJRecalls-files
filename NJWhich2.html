<title>ボン度計算の研究用</title>
<link rel="stylesheet" href="../standard/columns.css" type="text/css" />

<script language="javascript" type="text/javascript">
    function OnCalculate() {
        let string = document.inputForm.input.value;
        string = string.replace(/\s+/g, "");
        let table = document.getElementById("resultTable");
        let wordRowCells = table.rows[0].cells;
        let resultRowCells = table.rows[1].cells;
        
        
        for( var i = 0; i < wordRowCells.length; i++  ){
            let word = wordRowCells[i].innerHTML;
            let count = ( string.match( new RegExp( word, "g" ) ) || [] ).length;
            resultRowCells[i].innerHTML = count;
            
        }

    }
</script>

</head>

<p>
<form name="inputForm">
<label for="input">ソース文字列</label><br>
<textarea id="input" name="input" cols="40" rows="10"  placeholder="ここにソース文字列をペースト"></textarea>
</form>
<input type="button" value="計算" onclick="OnCalculate();"/>
